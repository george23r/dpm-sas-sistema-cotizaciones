name: Verificar flujo E2E web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "backend/**"
      - "database/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validar-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpm_test
          POSTGRES_PASSWORD: dpm_test
          POSTGRES_DB: dpm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U dpm_test -d dpm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://dpm_test:dpm_test@localhost:5432/dpm_test
      CORS_ORIGIN: http://127.0.0.1:5173
      SESSION_SECRET: ci-only-session-secret-change-me-32-chars
      NODE_ENV: test
      COOKIE_SECURE: "false"
      LOGIN_RATE_LIMIT_MAX: "100"
      VITE_API_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - name: Preparar base ficticia de E2E
        env:
          PGPASSWORD: dpm_test
        run: |
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/01_schema.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/02_seed.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/04_seed_e2e.sql
      - run: npm run build
        working-directory: backend
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Iniciar API
        run: nohup npm start > "$RUNNER_TEMP/dpm-api.log" 2>&1 &
        working-directory: backend
      - name: Esperar API
        run: curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:3000/health
      - name: Iniciar frontend
        run: nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/dpm-web.log" 2>&1 &
      - name: Esperar frontend
        run: curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:5173/login
      - run: npm run test:e2e
      - name: Publicar reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e-dpm
          path: |
            e2e-report/
            test-results/
            ${{ runner.temp }}/dpm-api.log
            ${{ runner.temp }}/dpm-web.log

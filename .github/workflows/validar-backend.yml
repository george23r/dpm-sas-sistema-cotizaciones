name: Verificar API y PostgreSQL

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/validar-backend.yml"
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dpm_test:dpm_test@localhost:5432/dpm_test
      CORS_ORIGIN: http://127.0.0.1:5173
      SESSION_SECRET: ci-only-session-secret-change-me-32-chars
      NODE_ENV: test
      COOKIE_SECURE: "false"
      RUN_INTEGRATION: "1"
      INTEGRATION_ADMIN_EMAIL: admin@dpm.example
      INTEGRATION_ADMIN_PASSWORD: Admin123!
      INTEGRATION_CLIENT_EMAIL: hacienda@cliente.example
      INTEGRATION_CLIENT_PASSWORD: Cliente123!
      INTEGRATION_OPERATOR_EMAIL: luis.gomez@dpm.example
      INTEGRATION_OPERATOR_PASSWORD: Operario123!
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpm_test
          POSTGRES_PASSWORD: dpm_test
          POSTGRES_DB: dpm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U dpm_test -d dpm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Crear esquema y verificaciones SQL
        env:
          PGPASSWORD: dpm_test
        run: |
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/01_schema.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/02_seed.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/03_consultas_comprobacion.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/04_seed_e2e.sql
      - run: npm run build
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend


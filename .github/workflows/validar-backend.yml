name: Verificar API y PostgreSQL

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/validar-backend.yml"
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpm_test
          POSTGRES_PASSWORD: dpm_test
          POSTGRES_DB: dpm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U dpm_test -d dpm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Crear esquema y verificaciones SQL
        env:
          PGPASSWORD: dpm_test
        run: |
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/01_schema.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/02_seed.sql
          psql -h localhost -U dpm_test -d dpm_test -v ON_ERROR_STOP=1 -f database/03_consultas_comprobacion.sql
      - run: npm run build
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test
        working-directory: backend

openapi: 3.1.0
info:
  title: DPM S.A.S. API
  version: 0.2.0
  description: Contrato de autenticaciÃ³n y HU-01/HU-02 sobre PostgreSQL. Las rutas pendientes se incorporarÃ¡n por fases.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: Servicio disponible }
  /ready:
    get:
      operationId: ready
      responses:
        '200': { description: Base de datos disponible }
        '503': { description: Base de datos no disponible }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: SesiÃ³n creada mediante cookie HttpOnly }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/me:
    get:
      operationId: me
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Usuario autenticado }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses: { '204': { description: SesiÃ³n cerrada } }
  /api/v1/clientes/{id}/historial:
    get:
      operationId: clientServiceHistory
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Servicios finalizados del cliente autorizado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Cliente no disponible }
  /api/v1/cotizaciones:
    get:
      operationId: listQuotes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Cotizaciones visibles para el rol autenticado }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createQuote
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } }
      responses:
        '201': { description: CotizaciÃ³n creada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/cotizaciones/{id}:
    get:
      operationId: getQuote
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Detalle; costos internos solo para administraciÃ³n }
        '404': { description: CotizaciÃ³n no disponible }
  /api/v1/cotizaciones/{id}/enviar:
    post:
      operationId: sendQuote
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Enviada mediante sp_enviar_cotizacion }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/cotizaciones/{id}/visitas:
    post:
      operationId: addTechnicalVisit
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Visita tÃ©cnica registrada }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/cotizaciones/{id}/lineas:
    post:
      operationId: addQuoteLine
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: LÃ­nea registrada }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/cotizaciones/{id}/costos:
    post:
      operationId: addInternalCost
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Costo interno registrado; solo administraciÃ³n } }
  /api/v1/cotizaciones/{id}/hitos:
    post:
      operationId: addMilestone
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Hito registrado } }
  /api/v1/cotizaciones/{id}/respuesta:
    post:
      operationId: answerQuote
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [acepta], properties: { acepta: { type: boolean } } } } }
      responses:
        '200': { description: Respuesta registrada }
        '403': { description: Cliente no propietario }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/ordenes:
    get:
      operationId: listOrders
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Ã“rdenes visibles segÃºn rol }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createOrder
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Orden creada desde cotizaciÃ³n aceptada }, '409': { description: Conflicto de horario o regla de negocio } }
  /api/v1/ordenes/mias:
    get:
      operationId: listMyOrders
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Ordenes de la cuadrilla del operario autenticado }, '403': { description: Solo operarios } }
  /api/v1/ordenes/{id}/iniciar:
    patch:
      operationId: startOrder
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Orden iniciada }, '409': { description: Operario no pertenece a la cuadrilla o transiciÃ³n invÃ¡lida } }
  /api/v1/ordenes/{id}/finalizar:
    patch:
      operationId: finishOrder
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Orden finalizada }, '409': { description: Cierre no permitido } }
  /api/v1/cuadrillas:
    get:
      operationId: listTeams
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Cuadrillas e indicadores registrados } }
    post:
      operationId: createTeam
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Cuadrilla creada }, '409': { description: Nombre duplicado } }
  /api/v1/cuadrillas/{id}:
    patch:
      operationId: updateTeam
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Cuadrilla actualizada }, '404': { description: Cuadrilla inexistente } }
  /api/v1/cuadrillas/{id}/miembros:
    get:
      operationId: listTeamMembers
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Integrantes de la cuadrilla } }
  /api/v1/planillas:
    get:
      operationId: listSheets
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Planillas administrativas y de campo } }
    post:
      operationId: createSheet
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Planilla creada }, '409': { description: Duplicada } }
  /api/v1/planillas/par:
    post:
      operationId: createSheetPair
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Par de planillas creado atÃ³micamente }, '409': { description: Ya existe el periodo } }
  /api/v1/planillas/comparar:
    get:
      operationId: compareSheets
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: ComparaciÃ³n por operario y fecha } }
  /api/v1/planillas/{id}/registros:
    post:
      operationId: addSheetRecord
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Turno registrado }, '409': { description: Planilla conciliada o turno duplicado }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/planillas/conciliar:
    post:
      operationId: reconcileSheets
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Planillas conciliadas }, '409': { description: Diferencias bloquean conciliaciÃ³n } }
  /api/v1/reportes/periodo:
    get:
      operationId: periodReport
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Reporte por periodo y cliente } }
  /api/v1/reportes/resumen:
    get:
      operationId: operationalSummary
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date } }
        - { name: clienteId, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Conteos agregados y actividad del centro operativo; no depende de una pÃ¡gina de cotizaciones }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/clientes:
    get:
      operationId: listClients
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Clientes visibles para administraciÃ³n } }
    post:
      operationId: createClient
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Cliente creado }, '409': { description: Nombre o NIT duplicado } }
  /api/v1/clientes/{id}:
    patch:
      operationId: updateClient
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Cliente actualizado }, '404': { description: Cliente inexistente }, '409': { description: Nombre o NIT duplicado } }
  /api/v1/zonas:
    get:
      operationId: listZones
      security: [{ sessionCookie: [] }]
      parameters: [{ name: clienteId, in: query, required: false, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Zonas visibles segÃºn rol y propiedad } }
    post:
      operationId: createZone
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Zona creada }, '409': { description: Nombre duplicado para el cliente } }
  /api/v1/zonas/{id}:
    patch:
      operationId: updateZone
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Zona actualizada }, '404': { description: Zona inexistente }, '409': { description: Nombre duplicado para el cliente } }
  /api/v1/servicios:
    get:
      operationId: listServices
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Servicios activos sin tarifas } }
  /api/v1/operarios:
    get:
      operationId: listWorkers
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Operarios y carga prÃ³xima para administraciÃ³n } }
    post:
      operationId: createWorker
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Operario creado }, '409': { description: LÃ­der activo duplicado } }
  /api/v1/operarios/{id}:
    patch:
      operationId: updateWorker
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Operario actualizado }, '404': { description: Operario inexistente }, '409': { description: LÃ­der activo duplicado } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: dpm_session }
  schemas:
    LoginRequest:
      type: object
      required: [correo, clave]
      properties:
        correo: { type: string, format: email, maxLength: 160 }
        clave: { type: string, minLength: 1, maxLength: 200 }
    QuoteRequest:
      type: object
      required: [zonaId, objeto]
      properties:
        clienteId: { type: integer, minimum: 1 }
        zonaId: { type: integer, minimum: 1 }
        objeto: { type: string, minLength: 3, maxLength: 200 }
        alcance: { type: string, maxLength: 5000 }
        incluye: { type: string, maxLength: 5000 }
        tiempoEjecucion: { type: string, maxLength: 200 }
        observaciones: { type: string, maxLength: 5000 }
        vigenciaDias: { type: integer, minimum: 1, maximum: 90, default: 15 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
  responses:
    Unauthorized:
      description: SesiÃ³n ausente, invÃ¡lida o credenciales incorrectas
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Usuario autenticado sin permisos para el recurso
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Entrada invÃ¡lida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }


openapi: 3.1.0
info:
  title: DPM S.A.S. API
  version: 0.1.0
  description: Contrato inicial de infraestructura y autenticación. Las rutas de negocio se agregan por fase.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      operationId: ready
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Base de datos disponible }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Base de datos no disponible }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada mediante cookie HttpOnly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/me:
    get:
      operationId: me
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Sesión cerrada }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dpm_session
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
    LoginRequest:
      type: object
      required: [correo, clave]
      properties:
        correo: { type: string, format: email, maxLength: 160 }
        clave: { type: string, minLength: 1, maxLength: 200 }
    User:
      type: object
      required: [id, nombre, correo, rol]
      properties:
        id: { type: integer }
        nombre: { type: string }
        correo: { type: string, format: email }
        rol: { type: string, enum: [administrador, cliente, operario] }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
  responses:
    Unauthorized:
      description: Sesión ausente, inválida o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

openapi: 3.1.0
info:
  title: DPM S.A.S. API
  version: 0.2.0
  description: Contrato de autenticación y HU-01/HU-02 sobre PostgreSQL. Las rutas pendientes se incorporarán por fases.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: Servicio disponible }
  /ready:
    get:
      operationId: ready
      responses:
        '200': { description: Base de datos disponible }
        '503': { description: Base de datos no disponible }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: Sesión creada mediante cookie HttpOnly }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/me:
    get:
      operationId: me
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Usuario autenticado }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses: { '204': { description: Sesión cerrada } }
  /api/v1/cotizaciones:
    get:
      operationId: listQuotes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Cotizaciones visibles para el rol autenticado }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createQuote
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } }
      responses:
        '201': { description: Cotización creada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/cotizaciones/{id}:
    get:
      operationId: getQuote
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Detalle; costos internos solo para administración }
        '404': { description: Cotización no disponible }
  /api/v1/cotizaciones/{id}/enviar:
    post:
      operationId: sendQuote
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Enviada mediante sp_enviar_cotizacion }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/cotizaciones/{id}/visitas:
    post:
      operationId: addTechnicalVisit
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Visita técnica registrada }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/cotizaciones/{id}/lineas:
    post:
      operationId: addQuoteLine
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Línea registrada }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/cotizaciones/{id}/costos:
    post:
      operationId: addInternalCost
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Costo interno registrado; solo administración } }
  /api/v1/cotizaciones/{id}/hitos:
    post:
      operationId: addMilestone
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '201': { description: Hito registrado } }
  /api/v1/cotizaciones/{id}/respuesta:
    post:
      operationId: answerQuote
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [acepta], properties: { acepta: { type: boolean } } } } }
      responses:
        '200': { description: Respuesta registrada }
        '403': { description: Cliente no propietario }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/ordenes:
    get:
      operationId: listOrders
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Órdenes visibles según rol }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createOrder
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Orden creada desde cotización aceptada }, '409': { description: Conflicto de horario o regla de negocio } }
  /api/v1/ordenes/{id}/iniciar:
    patch:
      operationId: startOrder
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Orden iniciada }, '409': { description: Operario no pertenece a la cuadrilla o transición inválida } }
  /api/v1/ordenes/{id}/finalizar:
    patch:
      operationId: finishOrder
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Orden finalizada }, '409': { description: Cierre no permitido } }
  /api/v1/cuadrillas:
    get:
      operationId: listTeams
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Cuadrillas e indicadores registrados } }
  /api/v1/planillas:
    get:
      operationId: listSheets
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Planillas administrativas y de campo } }
    post:
      operationId: createSheet
      security: [{ sessionCookie: [] }]
      responses: { '201': { description: Planilla creada }, '409': { description: Duplicada } }
  /api/v1/planillas/comparar:
    get:
      operationId: compareSheets
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Comparación por operario y fecha } }
  /api/v1/planillas/conciliar:
    post:
      operationId: reconcileSheets
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Planillas conciliadas }, '409': { description: Diferencias bloquean conciliación } }
  /api/v1/reportes/periodo:
    get:
      operationId: periodReport
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Reporte por periodo y cliente } }
  /api/v1/clientes:
    get:
      operationId: listClients
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Clientes visibles para administración } }
  /api/v1/zonas:
    get:
      operationId: listZones
      security: [{ sessionCookie: [] }]
      parameters: [{ name: clienteId, in: query, required: false, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Zonas visibles según rol y propiedad } }
  /api/v1/servicios:
    get:
      operationId: listServices
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Servicios activos sin tarifas } }
  /api/v1/operarios:
    get:
      operationId: listWorkers
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Operarios y carga próxima para administración } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: dpm_session }
  schemas:
    LoginRequest:
      type: object
      required: [correo, clave]
      properties:
        correo: { type: string, format: email, maxLength: 160 }
        clave: { type: string, minLength: 1, maxLength: 200 }
    QuoteRequest:
      type: object
      required: [zonaId, objeto]
      properties:
        clienteId: { type: integer, minimum: 1 }
        zonaId: { type: integer, minimum: 1 }
        objeto: { type: string, minLength: 3, maxLength: 200 }
        alcance: { type: string, maxLength: 5000 }
        incluye: { type: string, maxLength: 5000 }
        tiempoEjecucion: { type: string, maxLength: 200 }
        observaciones: { type: string, maxLength: 5000 }
        vigenciaDias: { type: integer, minimum: 1, maximum: 90, default: 15 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
  responses:
    Unauthorized:
      description: Sesión ausente, inválida o credenciales incorrectas
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Entrada inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
